# 在 Windows 上跑測試與換版測試。同事用的是 Windows，換版、退回只在 Windows 版的啟動程式裡。
name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8   # Windows 主控台預設不是 UTF-8，印中文會失敗
    steps:
      - uses: actions/checkout@v4
      - name: 安裝 uv
        shell: powershell
        run: |
          python -m pip install --quiet uv
          uv --version
      - name: 單元測試
        shell: powershell
        run: uv run --project app pytest tests -q
      - name: 換版與退回
        shell: powershell   # Windows PowerShell 5.1，和同事電腦一樣
        run: |
          $work = Join-Path $env:RUNNER_TEMP "dp-release"
          uv run --project app python tests\release\make_versions.py $work
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\release\test_update.ps1 $work
          exit $LASTEXITCODE
