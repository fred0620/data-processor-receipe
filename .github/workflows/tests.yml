# 在 Windows、macOS、Linux 上跑同一套測試。
# 換版與退回（tests/test_release.py）只在 Windows 上實際執行，其他系統會顯示略過。
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8   # Windows 主控台預設不是 UTF-8，印中文會失敗
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 測試
        run: uv run --project app pytest tests -q -rs

  # 用 .gitlab-ci.yml 指定的同一個映像檔跑 GitLab 的 test 與 package 步驟，
  # 確認映像檔標籤存在、指令在裡面能用。映像檔名稱只寫在 .gitlab-ci.yml，這裡讀出來用。
  gitlab-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "image=$(sed -n 's/^  UV_IMAGE: *//p' .gitlab-ci.yml)" >> "$GITHUB_OUTPUT"
  gitlab-steps:
    needs: gitlab-image
    runs-on: ubuntu-latest
    container: ${{ needs.gitlab-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: test（和 .gitlab-ci.yml 相同）
        shell: bash
        run: |
          . scripts/ci_env.sh
          env -u UV_DEFAULT_INDEX uv lock --project app --check --offline
          uv export --project app --frozen --no-emit-project --quiet --output-file /tmp/requirements-ci.txt
          uv venv /tmp/venv --python 3.12
          uv pip install --python /tmp/venv/bin/python --require-hashes -r /tmp/requirements-ci.txt
          /tmp/venv/bin/python -m pytest -q tests
      - name: package（和 .gitlab-ci.yml 相同）
        shell: bash
        run: |
          . scripts/ci_env.sh
          python3 --version
          python3 scripts/build_release.py --wheels
